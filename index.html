<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Plateau Publishing Co. | Enumclaw & Bonney Lake</title>
  <meta name="description" content="The Plateau Publishing Co. connects the Plateau through community stories and targeted print + digital marketing. Request a media kit to advertise." />
  <link rel="canonical" href="https://theplateaupublishingco.com/" />
  <meta property="og:title" content="The Plateau Publishing Co." />
  <meta property="og:description" content="Locally rooted. Plateau proud." />
  <meta property="og:url" content="https://theplateaupublishingco.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/img/og-cover-clean-no-text.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f6efe7;
      --ink:#1f1f1f;
      --muted:#5f5f5f;
      --card:#ffffff;
      --brand:#234236;
      --rust:#b74d34;
      --gold:#d4a44c;
      --nav:#efe7de;
    }

    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial;
      color:var(--ink); background:var(--bg);
    }

    header{
      background: url('/assets/img/og-cover-clean-no-text.jpg') center/cover no-repeat; color:#fff; padding:5rem 1rem 3rem; text-align:center;
    }
    header h1{margin:0; font-size:clamp(2.2rem,3.5vw,3.25rem); letter-spacing:.5px; font-family:'Playfair Display',serif; text-shadow:0 2px 4px rgba(0,0,0,.6)}
    header p{margin:.75rem auto 0; font-size:1.1rem; max-width:42rem; opacity:.95; text-shadow:0 1px 3px rgba(0,0,0,.6)}

    .cta-row{margin:1.25rem auto 0; display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap}
    .btn{
      background: var(--rust); color:#fff; border: none; padding:.75rem 1rem; border-radius:.75rem; text-decoration:none; font-weight:700;
      box-shadow: 0 2px 0 rgba(0,0,0,.08);
    }
    .btn:hover{background: var(--gold); color: var(--ink)}
    .btn.alt{background: var(--rust); color:#fff; border:2px solid var(--rust)}
    .btn.alt:hover{background: var(--gold); border-color: var(--gold); color: var(--ink)}

    .selector{margin:1rem auto; text-align:center}
    .selector label{font-weight:700; margin-right:.5rem}
    select{padding:.5rem .75rem; border-radius:.5rem; border:1px solid #dbcbb7; background:#fff}

    nav{
      position: sticky; top:0; z-index:50; background:var(--nav); border-bottom:1px solid #dbcbb7;
      display:flex; justify-content:center; gap:1rem; padding:.75rem 1rem; flex-wrap:wrap;
    }
    nav a{
      text-decoration:none; color:var(--ink); font-weight:700; padding:.4rem .7rem; border-radius:.5rem;
    }
    nav a:hover{background: var(--gold); color: var(--ink)}
    nav a.active{background: var(--brand); color:#fff}

    .section{padding:2.25rem 1rem; max-width:1000px; margin:auto}
    .section h2{font-size:clamp(1.5rem,2.2vw,2rem); margin:.25rem 0 1rem}
    .lead{font-size:1.1rem; line-height:1.7}

    .cards{display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:1rem}
    .card{background:var(--card); padding:1rem; border-radius:1rem; box-shadow:0 2px 6px rgba(0,0,0,.06)}

    .testimonial{background:var(--card); border-left:4px solid var(--rust); padding:1rem; margin:1rem 0; box-shadow:0 2px 4px rgba(0,0,0,.06)}
    .testimonial cite{display:block; margin-top:.5rem; font-style:italic; color:var(--muted)}

    .people{display:flex; gap:2rem; flex-wrap:wrap; justify-content:center; align-items:center}
    .person{text-align:center; max-width:300px}
    .person img{width:100%; border-radius:50%; object-fit:cover}

    .muted{color:var(--muted)}

    footer{background: var(--brand); color:#fff; text-align:center; padding:2rem 1rem; margin-top:2rem}
    footer .logo{margin-bottom:.5rem; font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:700}
    footer a{color:#fff; text-decoration:none}
    .social{display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; margin-top:.5rem}

    img{max-width:100%; height:auto}
    .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
  </style>
</head>
<body>
  <header id="top">
    <h1>THE PLATEAU PUBLISHING CO.</h1>
    <p>Locally rooted. Plateau proud.</p>
    <div class="cta-row">
      <a class="btn" href="#advertise">Advertise</a>
      <a class="btn alt" href="#contact">Contact</a>
    </div>
  </header>

  <div class="selector" aria-label="Select magazine edition">
    <label for="edition-select">Choose your edition:</label>
    <select id="edition-select" aria-label="Edition select">
      <option value="https://www.bestversionmedia.com/magazines/enumclawliving" selected>Enumclaw Living Edition</option>
      <option value="https://www.bestversionmedia.com/magazines/bonneylakeliving">Bonney Lake Living Edition</option>
    </select>
    <button class="btn" id="go-edition" type="button" aria-label="Go to selected edition">Go</button>
  </div>

  <nav id="site-nav" aria-label="Primary">
    <a href="#about">About</a>
    <a href="#magazines">Magazines</a>
    <a href="#advertise">Advertise</a>
    <a href="#publishers">Publishers</a>
    <a href="#contact">Contact</a>
  </nav>

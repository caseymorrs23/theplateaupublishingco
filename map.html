<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plateau Map | Reserve Your Spot</title>
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>

<form
  id="mapAgreementForm"
  action="https://script.google.com/macros/s/AKfycbyE9DEI2KCqPj3powR0dorp37KfGt17AT33MvbdBf_8AsXEFfthB6Sr1JGWSQE6U2dQ/exec"
  method="POST"
  target="submissionFrame"
>

  <input name="contactName" placeholder="Name" required>
  <input name="businessName" placeholder="Business" required>
  <input name="email" placeholder="Email" required>

  <select id="adSize" name="adSize">
    <option value="Single Ad">Single</option>
    <option value="Double Ad">Double</option>
  </select>

  <select id="paymentPlan" name="paymentPlan">
    <option value="Full Payment">Full</option>
    <option value="50% Down">50%</option>
  </select>

  <label>
    <input type="checkbox" id="mapLocation" name="mapLocation" value="Yes">
    Add map
  </label>

  <textarea name="notes"></textarea>

  <input name="signature" placeholder="Signature" required>

  <input type="hidden" id="paymentLink" name="paymentLink">
  <input type="hidden" id="packageDetails" name="packageDetails">

  <button type="submit">Submit</button>

  <div id="formStatus"></div>
  <div id="paymentBox" style="display:none;"></div>

</form>

<iframe name="submissionFrame" style="display:none;"></iframe>

<script>
(function(){

  const form = document.getElementById('mapAgreementForm');
  const status = document.getElementById('formStatus');
  const paymentBox = document.getElementById('paymentBox');

  let submitting = false;

  function getPaymentLink() {
    const ad = document.getElementById('adSize').value;
    const map = document.getElementById('mapLocation').checked;
    const plan = document.getElementById('paymentPlan').value;

    if (ad === "Single Ad" && plan === "Full Payment") return "https://swipesimple.com/links/lnk_d23e2bca5d5ab0d108e7954b3d468382";
    if (ad === "Single Ad" && plan === "50% Down") return "https://swipesimple.com/links/lnk_507f26cdc1254c556ebfdb19b6cffbf7";
    if (ad === "Double Ad" && plan === "Full Payment") return "https://swipesimple.com/links/lnk_b20584f668c44db69a7f1dd49f7afd85";
    if (ad === "Double Ad" && plan === "50% Down") return "https://swipesimple.com/links/lnk_59c4b105652263967ddff0ab2f56b402";

    return "";
  }

  function getPackage() {
    const ad = document.getElementById('adSize').value;
    const map = document.getElementById('mapLocation').checked;
    const plan = document.getElementById('paymentPlan').value;

    return (map ? ad + " + Map" : ad) + " - " + plan;
  }

  form.addEventListener('submit', function(){

    document.getElementById('paymentLink').value = getPaymentLink();
    document.getElementById('packageDetails').value = getPackage();

    submitting = true;
    status.textContent = "Submitting agreement...";
    paymentBox.style.display = "none";
    paymentBox.innerHTML = "";

  });

  window.addEventListener('message', function(event){

    if (!submitting) return;
    if (!event.data) return;

    // ✅ allow Google Apps Script responses
    const allowed = [
      "https://script.google.com",
      "https://script.googleusercontent.com"
    ];

    if (!allowed.includes(event.origin)) return;

    if (event.data.status === "success") {

      submitting = false;

      status.textContent = "Agreement submitted successfully.";

      const link = event.data.paymentLink || document.getElementById('paymentLink').value;
      const pkg = event.data.packageDetails || document.getElementById('packageDetails').value;

      paymentBox.style.display = "block";
      paymentBox.innerHTML = `
        <p><strong>${pkg}</strong></p>
        <a href="${link}" target="_blank">Complete Payment</a>
      `;

      form.reset();
    }

    if (event.data.status === "error") {
      submitting = false;
      status.textContent = "Submission failed.";
    }

  });

})();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Plateau Map | Reserve Your Spot</title>
<style>
body{font-family:Arial;padding:20px;background:#f8f8f8}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:10px}
.notice{background:#fff3cd;padding:10px;border-radius:6px;margin-bottom:15px;font-weight:bold}
input,select{width:100%;padding:8px;margin:5px 0 10px}
button{padding:12px 20px;background:#8B4513;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="container">

<div class="notice" id="spotsRemaining">99 of 100 spots remaining</div>

<h2>Reserve Your Advertising Spot</h2>

<form id="form">

<label>Ad Size</label>
<select id="adSize" required>
<option value="" data-price="0">Select</option>
<option value="Single" data-price="1000">Single - $1,000</option>
<option value="Double" data-price="2000">Double - $2,000</option>
</select>

<label>
<input type="checkbox" id="mapLocation"> Add Map Location (+$500)
</label>

<label>Payment Method</label>
<select id="paymentMethod">
<option value="ACH">ACH / Check (No Fee)</option>
<option value="Card">Card (+3.5%)</option>
</select>

<label>Subtotal</label>
<input id="subtotal" readonly>

<label>Processing Fee</label>
<input id="processingFee" readonly>

<label>Total</label>
<input id="total" readonly>

<label>Deposit (50%)</label>
<input id="deposit" readonly>

<label>Balance</label>
<input id="balance" readonly>

<p>Most advertisers choose ACH to avoid the 3.5% processing fee.</p>

<button type="submit">Reserve My Spot & Receive Invoice</button>

</form>

</div>

<script>
function updatePricing(){
let ad=document.getElementById('adSize');
let loc=document.getElementById('mapLocation');
let pay=document.getElementById('paymentMethod');

let base=parseInt(ad.options[ad.selectedIndex].dataset.price||0);

if(loc.checked) base+=500;

let fee=0;
if(pay.value==="Card"){fee=Math.round(base*0.035);}

let total=base+fee;
let deposit=Math.round(total*0.5);
let balance=total-deposit;

document.getElementById('subtotal').value=base;
document.getElementById('processingFee').value=fee;
document.getElementById('total').value=total;
document.getElementById('deposit').value=deposit;
document.getElementById('balance').value=balance;
}

document.getElementById('adSize').addEventListener('change',updatePricing);
document.getElementById('mapLocation').addEventListener('change',updatePricing);
document.getElementById('paymentMethod').addEventListener('change',updatePricing);

updatePricing();
</script>

</body>
</html>

<script>
// Smarter dropdown position + active link highlight
document.addEventListener('DOMContentLoaded', function(){
  const parents=document.querySelectorAll('.has-dropdown');
  parents.forEach(p=>{
    const m=p.querySelector('.dropdown');
    function show(){ m.style.display='block'; position(); }
    function hide(){ m.style.display='none'; }
    function position(){
      const rect=m.getBoundingClientRect();
      if(rect.right>window.innerWidth){ m.style.left='auto'; m.style.right='0'; } else { m.style.left='0'; m.style.right='auto'; }
    }
    p.addEventListener('mouseenter',show); p.addEventListener('mouseleave',hide);
    window.addEventListener('resize',()=>{ if(m.style.display==='block') position(); });
  });
  const path=window.location.pathname.replace(/\/$/, '');
  document.querySelectorAll('#site-nav a[href]').forEach(a=>{
    const href=a.getAttribute('href').replace(/\/$/,''); if(href===path) a.classList.add('active-link');
  });
});
</script>

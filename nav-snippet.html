<script>
document.addEventListener('DOMContentLoaded', function(){
  const nav = document.getElementById('site-nav');
  const links = nav.querySelectorAll('a[href]');
  links.forEach(a => { a.addEventListener('mouseenter', ()=>{ a.style.background = 'var(--gold)'; a.style.color='var(--ink)'; }); a.addEventListener('mouseleave', ()=>{ a.style.background = ''; a.style.color='var(--ink)'; }); });
  const parent = document.querySelector('.has-dropdown');
  if(parent){
    const menu = parent.querySelector('.dropdown');
    parent.addEventListener('mouseenter', ()=> menu.style.display='block');
    parent.addEventListener('mouseleave', ()=> menu.style.display='none');
  }
});
</script>
